name: hotelmanager

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: ${MSSQL_PID:?Define MSSQL_PID in deploy/.env.server}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in deploy/.env.server}
    volumes:
      - sql_data:/var/opt/mssql
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${APP_ORIGIN:?Define APP_ORIGIN in deploy/.env.server}
      SQLSERVER_HOST: db
      SQLSERVER_DATABASE: HotelManagerDB
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in deploy/.env.server}
      # El conector heredado activa encrypt cuando esta variable es 'false'.
      SQLSERVER_ENCRYPT: 'false'
      SQLSERVER_TRUST_CERT: 'true'
      SESSION_COOKIE_NAME: hotelmanager_session
      SESSION_HOURS: 12
      SESSION_REMEMBER_HOURS: 720
      SECURITY_ADMIN_ROLES: ADMINFULL
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-3088}:3000'
    networks: [private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3

  web:
    profiles: [web]
    build:
      context: ../frontHotelManager
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]

networks:
  private:
    internal: true

volumes:
  sql_data:
